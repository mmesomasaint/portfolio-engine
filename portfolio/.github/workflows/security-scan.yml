name: "DevSecOps - SAST & Container Vulnerability Scan"

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly Sunday run
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  sast-codeql:
    name: "CodeQL Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3

  container-vulnerability-scan:
    name: "Trivy Container CVE Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build Local Test Container"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: portfolio-sys:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Run Aqua Trivy Vulnerability Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "portfolio-sys:scan-target"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1" # Fail the build on Critical/High vulnerabilities
          ignore-unfixed: true

      - name: "Upload Trivy SARIF Output to GitHub Security Tab"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
